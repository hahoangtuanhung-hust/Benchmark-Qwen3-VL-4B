# =============================================================================
# Qwen3-VL-4B Benchmark — Dataset Configuration
# =============================================================================
# See: docs/qwen3_vl_4b_llamacpp_benchmark_agent_prompt.md §8, §9
# =============================================================================

performance:
  # Performance image sets (§8.1)
  image_sets:
    small:
      description: "Small resolution images for baseline latency"
      resolution_target: "512x512"
      target_width: 512
      target_height: 512
      samples: 10
      directory: "benchmark_data/performance/small"

    normal:
      description: "Normal resolution — primary workload"
      resolution_target: "1280x720"
      target_width: 1280
      target_height: 720
      samples: 30
      directory: "benchmark_data/performance/normal"

    large:
      description: "Large resolution images for stress test"
      resolution_target: "1920x1080"
      target_width: 1920
      target_height: 1080
      samples: 10
      directory: "benchmark_data/performance/large"

  # Fixed prompt for performance tests (§8.2)
  prompt: "Describe the important objects, text, and events visible in this image. Be concise and factual."

  # Manifest path
  manifest: "benchmark_data/manifest.jsonl"

accuracy:
  # Accuracy datasets (§9)
  datasets:
    textvqa:
      name: "TextVQA"
      description: "Visual Question Answering on text in images"
      official_metric: "vqa_accuracy"
      fallback_metric: "exact_match_normalized"
      source: "https://textvqa.org/"
      directory: "benchmark_data/accuracy/textvqa"

    docvqa:
      name: "DocVQA"
      description: "Document Visual Question Answering"
      official_metric: "anls"
      fallback_metric: "exact_match_normalized"
      source: "https://www.docvqa.org/"
      directory: "benchmark_data/accuracy/docvqa"

    chartvqa:
      name: "ChartQA"
      description: "Chart Question Answering"
      official_metric: "relaxed_accuracy"
      fallback_metric: "exact_match_normalized"
      source: "https://github.com/vis-nlp/ChartQA"
      directory: "benchmark_data/accuracy/chartvqa"

  # Sample counts (§9)
  quick_samples: 50
  full_samples: 200
